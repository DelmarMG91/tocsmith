name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Smoke-test the CLI
        run: |
          node bin/tocsmith.js --version
          node bin/tocsmith.js --help
          printf '# Hello\n\n## World\n' > /tmp/smoke.md
          node bin/tocsmith.js /tmp/smoke.md --insert
          node bin/tocsmith.js /tmp/smoke.md --check
